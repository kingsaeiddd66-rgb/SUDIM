name: telegram-pipeline-test

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Telegram dependencies
        run: |
          pip install requests python-dotenv

      - name: Create test result
        run: |
          python test_result.py

      - name: Show result.json
        run: |
          echo "----- result.json -----"
          cat result.json

      - name: Send result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python send_telegram.py result.json
